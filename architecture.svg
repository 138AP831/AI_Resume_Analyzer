<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="640" viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>AI Resume Analyzer - Architecture</title>
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="aCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#00f0ff"/></marker>
    <marker id="aPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff2bd6"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#39ff14"/></marker>
    <marker id="aYellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff200"/></marker>
    <style>
      .t { fill:#ffffff; font-size:15px; font-weight:700; text-anchor:middle; }
      .s { fill:#9aa4b2; font-size:11.5px; text-anchor:middle; }
      .lane { font-size:13px; font-weight:700; letter-spacing:3px; }
      .flow { stroke-dasharray:7 7; fill:none; stroke-width:2.2; animation: dash 1.1s linear infinite; }
      @keyframes dash { to { stroke-dashoffset:-14; } }
      .box { fill:#05060d; stroke-width:2.2; filter:url(#glow); animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { stroke-opacity:1; } 50% { stroke-opacity:.45; } }
    </style>
  </defs>

  <rect width="1200" height="640" fill="#000"/>
  <!-- subtle grid -->
  <g stroke="#0b1020" stroke-width="1">
    <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200M0 560H1200"/>
    <path d="M80 0V640M160 0V640M240 0V640M320 0V640M400 0V640M480 0V640M560 0V640M640 0V640M720 0V640M800 0V640M880 0V640M960 0V640M1040 0V640M1120 0V640"/>
  </g>

  <text x="600" y="38" text-anchor="middle" fill="#fff" font-size="22" font-weight="800" filter="url(#glow)">AI RESUME ANALYZER - ASP.NET CORE 8 WEB API</text>

  <!-- ===== Request lane ===== -->
  <text x="40" y="92" class="lane" fill="#00f0ff" filter="url(#glow)">REQUEST PIPELINE</text>

  <rect class="box" x="40"  y="130" width="170" height="70" rx="10" stroke="#00f0ff"/>
  <text class="t" x="125" y="160">Client / Swagger</text><text class="s" x="125" y="180">POST /api/Resume/analyze</text>

  <rect class="box" x="270" y="130" width="170" height="70" rx="10" stroke="#00f0ff" style="animation-delay:.4s"/>
  <text class="t" x="355" y="160">ASP.NET Core</text><text class="s" x="355" y="180">routing + model binding</text>

  <rect class="box" x="500" y="130" width="170" height="70" rx="10" stroke="#00f0ff" style="animation-delay:.8s"/>
  <text class="t" x="585" y="160">ResumeController</text><text class="s" x="585" y="180">REST endpoints</text>

  <rect class="box" x="730" y="130" width="170" height="70" rx="10" stroke="#b44dff" style="animation-delay:1.2s"/>
  <text class="t" x="815" y="160">IResumeAnalyzerService</text><text class="s" x="815" y="180">resolved by DI</text>

  <rect class="box" x="960" y="130" width="170" height="70" rx="10" stroke="#b44dff" style="animation-delay:1.6s"/>
  <text class="t" x="1045" y="160">ResumeAnalyzerService</text><text class="s" x="1045" y="180">analysis orchestration</text>

  <path class="flow" d="M210,165 H268"  stroke="#00f0ff" marker-end="url(#aCyan)"/>
  <path class="flow" d="M440,165 H498"  stroke="#00f0ff" marker-end="url(#aCyan)"/>
  <path class="flow" d="M670,165 H728"  stroke="#00f0ff" marker-end="url(#aCyan)"/>
  <path class="flow" d="M900,165 H958"  stroke="#b44dff" marker-end="url(#aCyan)" style="stroke:#b44dff"/>

  <!-- ===== Engine lane ===== -->
  <text x="40" y="362" class="lane" fill="#ff2bd6" filter="url(#glow)">ANALYSIS ENGINE + PERSISTENCE</text>

  <rect class="box" x="960" y="400" width="170" height="70" rx="10" stroke="#ff2bd6"/>
  <text class="t" x="1045" y="430">Skill Extraction</text><text class="s" x="1045" y="450">SkillDictionary lookup</text>

  <rect class="box" x="730" y="400" width="170" height="70" rx="10" stroke="#ff2bd6" style="animation-delay:.4s"/>
  <text class="t" x="815" y="430">Match Engine</text><text class="s" x="815" y="450">LINQ: matched vs missing</text>

  <rect class="box" x="500" y="400" width="170" height="70" rx="10" stroke="#fff200" style="animation-delay:.8s"/>
  <text class="t" x="585" y="430">Score + Suggestions</text><text class="s" x="585" y="450">match % and tips</text>

  <rect class="box" x="270" y="400" width="170" height="70" rx="10" stroke="#39ff14" style="animation-delay:1.2s"/>
  <text class="t" x="355" y="430">Entity Framework Core</text><text class="s" x="355" y="450">DbContext + SaveChanges</text>

  <rect class="box" x="40"  y="400" width="170" height="70" rx="10" stroke="#ff8a00" style="animation-delay:1.6s"/>
  <text class="t" x="125" y="430">SQLite</text><text class="s" x="125" y="450">analysis history</text>

  <path class="flow" d="M958,435 H902" stroke="#ff2bd6" marker-end="url(#aPink)"/>
  <path class="flow" d="M728,435 H672" stroke="#ff2bd6" marker-end="url(#aPink)"/>
  <path class="flow" d="M498,435 H442" stroke="#39ff14" marker-end="url(#aGreen)"/>
  <path class="flow" d="M268,435 H212" stroke="#39ff14" marker-end="url(#aGreen)"/>

  <!-- Service -> Skill extraction (resume + JD text) -->
  <path class="flow" d="M1045,200 V398" stroke="#ff2bd6" marker-end="url(#aPink)"/>
  <text x="1055" y="300" class="s" style="fill:#ff2bd6;text-anchor:start">resume + JD text</text>

  <!-- CRUD path: Controller -> EF Core for history / get / delete -->
  <path class="flow" d="M585,200 V262 H355 V398" stroke="#39ff14" marker-end="url(#aGreen)" style="animation-duration:1.6s"/>
  <text x="470" y="254" class="s" style="fill:#39ff14">history / get by id / delete</text>

  <!-- DI note -->
  <text x="800" y="335" class="s" style="fill:#b44dff">DI container: IResumeAnalyzerService + DbContext</text>

  <!-- Response return path -->
  <path class="flow" d="M585,470 V570 H15 V165 H38" stroke="#fff200" marker-end="url(#aYellow)"/>
  <text x="300" y="590" class="s" style="fill:#fff200">200 OK JSON: id, matchPercentage, matchedSkills, missingSkills, suggestions</text>

  <!-- footer legend -->
  <g font-size="11.5" fill="#9aa4b2">
    <circle cx="40" cy="620" r="5" fill="#00f0ff"/><text x="52" y="624">request</text>
    <circle cx="120" cy="620" r="5" fill="#b44dff"/><text x="132" y="624">service layer (DI)</text>
    <circle cx="250" cy="620" r="5" fill="#ff2bd6"/><text x="262" y="624">analysis</text>
    <circle cx="330" cy="620" r="5" fill="#39ff14"/><text x="342" y="624">EF Core</text>
    <circle cx="410" cy="620" r="5" fill="#fff200"/><text x="422" y="624">response</text>
  </g>
</svg>
